# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: ashwheelz-feedback
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ashwheelz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_TIMEZONE
        value: Asia/Karachi

databases:
  - name: ashwheelz-db
    plan: basic-256mb
    databaseName: ashwheelz
